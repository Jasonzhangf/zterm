<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zterm V2 Setup</title>
    <style>
      :root {
        color-scheme: light;
        --canvas: #f5f7f6;
        --surface: #ffffff;
        --ink: #17211c;
        --muted: #5a6660;
        --line: #ccd6d1;
        --accent: #0f766e;
        --accent-soft: #dcefeb;
        --danger: #a12828;
        --danger-soft: #fbe7e4;
        --warn-soft: #fdf3d7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--canvas);
        color: var(--ink);
        font: 15px/1.45 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button,
      input {
        font: inherit;
      }

      .bootstrap-shell {
        max-width: 960px;
        margin: 0 auto;
        padding: 24px 20px 40px;
      }

      .brandbar {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 18px;
        color: var(--muted);
        font-size: 13px;
      }

      .brandbar strong {
        color: var(--ink);
        font-size: 16px;
      }

      .bootstrap-page > * + * {
        margin-top: 14px;
      }

      .page-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
      }

      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 650;
        letter-spacing: 0;
      }

      .page-sub {
        margin: 6px 0 0;
        max-width: 70ch;
        color: var(--muted);
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        padding: 16px;
      }

      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
      }

      .panel-head h2 {
        margin: 0;
        font-size: 16px;
        font-weight: 650;
      }

      .field {
        display: grid;
        gap: 6px;
        margin-bottom: 12px;
      }

      .field span,
      .field small {
        color: var(--muted);
        font-size: 13px;
      }

      input {
        min-width: 0;
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 9px 11px;
        background: #ffffff;
        color: var(--ink);
      }

      input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      .actions,
      .page-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      button {
        border: 1px solid var(--accent);
        border-radius: 6px;
        padding: 9px 14px;
        background: var(--accent);
        color: #ffffff;
        cursor: pointer;
      }

      button.secondary,
      .page-nav button {
        border-color: var(--line);
        background: var(--surface);
        color: var(--ink);
      }

      button:disabled {
        cursor: not-allowed;
        border-color: var(--line);
        background: var(--surface-muted, #e9eeeb);
        color: var(--muted);
        opacity: 0.75;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 4px 10px;
        font-size: 12px;
        white-space: nowrap;
      }

      .badge-ok {
        border-color: var(--accent);
        background: var(--accent-soft);
        color: var(--accent);
      }

      .badge-muted {
        color: var(--muted);
      }

      .alert {
        margin: 0 0 12px;
        border: 1px solid #e3b7b2;
        border-radius: 6px;
        background: var(--danger-soft);
        color: var(--danger);
        padding: 10px 12px;
        overflow-wrap: anywhere;
      }

      .status-line {
        margin: 0;
        color: var(--muted);
        overflow-wrap: anywhere;
      }

      .workspace-list,
      .machine-list {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 8px;
      }

      .workspace-list button {
        display: grid;
        gap: 3px;
        width: 100%;
        text-align: left;
        border-color: var(--line);
        background: var(--surface);
        color: var(--ink);
      }

      .workspace-list button:hover,
      .workspace-list button:focus-visible {
        border-color: var(--accent);
        background: var(--accent-soft);
        outline: none;
      }

      .workspace-name,
      .machine-name {
        font-weight: 600;
        overflow-wrap: anywhere;
      }

      .workspace-id,
      .machine-id {
        font-size: 12px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }

      .machine-list li {
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 10px 12px;
        background: var(--surface);
      }

      .read-only-note {
        border: 1px solid #e5d48d;
        border-radius: 6px;
        background: var(--warn-soft);
        color: #6b5a14;
        padding: 10px 12px;
      }

      @media (max-width: 700px) {
        .bootstrap-shell {
          padding: 16px 14px 32px;
        }

        .page-head {
          flex-direction: column;
          align-items: stretch;
        }

        h1 {
          font-size: 19px;
        }

        .panel,
        .panel-head {
          padding: 14px;
        }

        .actions button,
        .page-nav button,
        .page-head > button {
          width: 100%;
        }

        .workspace-list,
        .machine-list {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="bootstrap-shell">
      <div class="brandbar">
        <strong>Zterm V2</strong>
        <span>First-run setup</span>
      </div>
      <main id="bootstrap-root" aria-live="polite"></main>
    </div>
    <script type="module" src="./entry.mjs"></script>
  </body>
</html>
