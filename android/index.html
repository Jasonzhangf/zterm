<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="color-scheme" content="dark light" />
    <title>zterm</title>
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0b1220;
        color: #e6edf6;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: #0b1220;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 13px;
        letter-spacing: 0.4px;
        z-index: 0;
      }
      #boot-splash::before {
        content: "";
        width: min(28vw, 128px);
        aspect-ratio: 1;
        background: url("/assets/logo.png") center / contain no-repeat;
      }
      /* Only show the splash placeholder while React has not mounted anything
         into #root. Once #root is non-empty the splash must be hidden, otherwise
         the fixed full-viewport overlay permanently covers the rendered app. */
      #root:empty + #boot-splash { display: flex; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash" aria-hidden="true"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
