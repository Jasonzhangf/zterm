apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

def packageJson = new JsonSlurper().parse(file('../../../package.json'))
def fileTransferThroughputContract = new JsonSlurper().parse(
    file('../../../contracts/file-transfer-throughput.json')
)
def nativeFileWriteBatchChunks = Integer.parseInt(
    String.valueOf(fileTransferThroughputContract.native_write_batch_chunks)
)
if (nativeFileWriteBatchChunks < 1) {
    throw new GradleException('native_write_batch_chunks must be a positive integer')
}
def buildMetaFile = file('../../../.build-meta.json')
def buildMeta = buildMetaFile.exists() ? new JsonSlurper().parse(buildMetaFile) : [buildNumber: 1000]
def appVersionContract = new JsonSlurper().parse(file('../../../contracts/app-version.json'))
def semverParts = String.valueOf(packageJson.version).tokenize('.').collect { part ->
    try {
        return Integer.parseInt(part.replaceAll(/[^0-9].*$/, ''))
    } catch (Exception ignored) {
        return 0
    }
}
while (semverParts.size() < 3) {
    semverParts << 0
}
def appVersionName = String.valueOf(packageJson.version)
def buildNumber = Math.max(1000, Integer.parseInt(String.valueOf(buildMeta.buildNumber)))
def rollbackVariant = providers.gradleProperty('ztermRollbackVariant').orNull == 'true'
def appDisplayVersion = "${appVersionName}.${String.format('%04d', buildNumber)}${rollbackVariant ? '.1' : ''}"
def normalVersionCode = Integer.parseInt(String.valueOf(appVersionContract.version_code_epoch)) +
    (buildNumber * Integer.parseInt(String.valueOf(appVersionContract.normal_slot_stride)))
def appVersionCode = normalVersionCode + (rollbackVariant
    ? Integer.parseInt(String.valueOf(appVersionContract.rollback_offset))
    : 0)
if (appVersionCode > Integer.parseInt(String.valueOf(appVersionContract.android_version_code_max))) {
    throw new GradleException("versionCode ${appVersionCode} exceeds app-version contract limit")
}

android {
    namespace = "com.zterm.android"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    defaultConfig {
        applicationId "com.zterm.android"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appDisplayVersion
        buildConfigField 'int', 'FILE_TRANSFER_NATIVE_WRITE_BATCH_CHUNKS', String.valueOf(nativeFileWriteBatchChunks)
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

android {
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

apply from: 'capacitor.build.gradle'

android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
