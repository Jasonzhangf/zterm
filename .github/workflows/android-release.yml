name: Android Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag. Defaults to v<latest.json versionName>.
        required: false
        type: string
      daemon_packages_run_id:
        description: CLI Platform run ID that produced the zterm-daemon-packages artifact.
        required: true
        type: string
      publish_npm:
        description: Publish zterm-daemon to npm. Requires NPM_TOKEN secret.
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install tmux
        run: brew install tmux

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Repo layout gate
        run: pnpm run test:repo-layout

      - name: Git main protection verification profile
        run: |
          ./scripts/setup/enable-local-protection.sh
          pnpm run verify:ci

      - name: Check published wterm runtime versions
        run: pnpm --dir android run deps:check-wterm-published

      - name: Build Android update package
        run: ./scripts/build-android-debug.sh
        working-directory: android

      - name: Prepare daemon standalone release
        run: pnpm --dir android run daemon:prepare-release

      - name: Download daemon npm package set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./android/package.json").version')"
          PACKAGE_DIR="${GITHUB_WORKSPACE}/android/release-dist/npm/zterm-daemon-${VERSION}"
          mkdir -p "${PACKAGE_DIR}"
          gh run download "${{ inputs.daemon_packages_run_id }}" \
            --name zterm-daemon-packages \
            --dir "${PACKAGE_DIR}"
          echo "ZTERM_DAEMON_PACKAGES_DIR=${PACKAGE_DIR}" >> "${GITHUB_ENV}"

      - name: Verify release assets
        run: pnpm --dir android run release:verify -- --daemon-packages-dir "${ZTERM_DAEMON_PACKAGES_DIR}"

      - name: Publish daemon to npm
        if: ${{ inputs.publish_npm }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./android/package.json").version')"
          PACKAGE_SET="${ZTERM_DAEMON_PACKAGES_DIR:?}"
          npm publish "${PACKAGE_SET}/jsonstudio-zterm-daemon-darwin-arm64-${VERSION}.tgz" --access public
          npm publish "${PACKAGE_SET}/jsonstudio-zterm-daemon-linux-x64-${VERSION}.tgz" --access public
          npm publish "${PACKAGE_SET}/jsonstudio-zterm-daemon-win32-x64-${VERSION}.tgz" --access public
          npm publish "${PACKAGE_SET}/jsonstudio-zterm-daemon-${VERSION}.tgz" --access public

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            pnpm --dir android run release:github -- "${{ inputs.tag }}"
          else
            pnpm --dir android run release:github
          fi
