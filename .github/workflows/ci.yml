name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appsdk-governance:
    name: AppSDK record graph gate
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned AppSDK binary
        env:
          APPSDK_URL: https://github.com/Jasonzhangf/appsdk/releases/download/v0.1.3/appsdk-0.1.3-macos-arm64
          APPSDK_SHA256: e3c36ae25c94d0c01c81cfe084fac7de8dc577f5ba3b8f91ae18b9d0587631a5
        run: |
          mkdir -p "$RUNNER_TEMP/appsdk"
          curl -fsSL "$APPSDK_URL" -o "$RUNNER_TEMP/appsdk/appsdk"
          chmod +x "$RUNNER_TEMP/appsdk/appsdk"
          test "$(shasum -a 256 "$RUNNER_TEMP/appsdk/appsdk" | awk '{print $1}')" = "$APPSDK_SHA256"
          echo "$RUNNER_TEMP/appsdk" >> "$GITHUB_PATH"

      - name: AppSDK record graph verify
        run: node android/scripts/verify-appsdk-binary.mjs android && appsdk verify android

  repo-layout:
    name: App repo layout gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Repo layout gate
        run: pnpm run test:repo-layout

  android:
    name: Android typecheck and regression
    needs: repo-layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Repo layout gate
        run: pnpm run test:repo-layout

      - name: Check published wterm runtime versions
        run: pnpm --dir android run deps:check-wterm-published

      - name: Type check
        run: pnpm --dir android run type-check

      - name: Feature registry and architecture truth gates
        run: pnpm --dir android run test:feature-registry

      - name: Shared foundation contract ownership gate
        run: pnpm --dir android run test:shared-contract-ownership

      - name: Runtime architecture v2 foundation gate
        run: pnpm --dir android run test:runtime-architecture-v2

      - name: Plugin host production gate
        run: pnpm --dir android run test:plugin-host

      - name: Debug console UI production gate
        run: pnpm --dir android run test:debug-console-ui

      - name: Session drawer UI production gate
        run: pnpm --dir android run test:session-drawer-ui

      - name: File browser UI production gate
        run: pnpm --dir android run test:file-browser-ui

      - name: Settings update UI production gate
        run: pnpm --dir android run test:settings-update-ui

      - name: Remote window UI production gate
        run: pnpm --dir android run test:remote-window-ui

      - name: Quickbar UI production gate
        run: pnpm --dir android run test:quickbar-ui

      - name: Terminal shell UI production gate
        run: pnpm --dir android run test:terminal-shell-ui

      - name: Composition root production gate
        run: pnpm --dir android run test:composition-root

      - name: Control center production gate
        run: pnpm --dir android run test:control-center

      - name: Daemon control center production gate
        run: pnpm --dir android run test:daemon-control-center

      - name: Daemon buffer publisher production gate
        run: pnpm --dir android run test:daemon-buffer-publisher

      - name: Daemon session catalog production gate
        run: pnpm --dir android run test:daemon-session-catalog

      - name: Attachment message delivery production gate
        run: pnpm --dir android run test:attachment-message-delivery

      - name: File transfer message route production gate
        run: pnpm --dir android run test:file-transfer-message-route

      - name: Daemon source adapter ownership gate
        run: pnpm --dir android run test:source-adapter-ownership

      - name: Daemon mirror writer ownership gate
        run: pnpm --dir android run test:mirror-writer-ownership

      - name: Client input normalizer ownership gate
        run: pnpm --dir android run test:input-normalizer

      - name: Client reliable input ownership gate
        run: pnpm --dir android run test:reliable-input-ownership

      - name: Daemon input queue production gate
        run: pnpm --dir android run test:daemon-input-queue

      - name: Terminal channel mux production gate
        run: pnpm --dir android run test:terminal-channel-mux

      - name: Session input runtime production gate
        run: pnpm --dir android run test:session-input-runtime

      - name: Debug observability production gate
        run: pnpm --dir android run test:debug-observability

      - name: Terminal shell theme gate
        run: pnpm --dir android run test:terminal:shell-theme

      - name: Relay account directory gate
        run: pnpm --dir android run test:relay:account-directory

      - name: Workspace panes gate
        run: pnpm --dir android run test:workspace:panes


      - name: File-transfer throughput gate
        run: pnpm --dir android run test:file-transfer:throughput

      - name: Terminal atomic frame assembly gate
        run: pnpm --dir android run test:terminal:frame-assembly

      - name: Transport network lifecycle gate
        run: pnpm --dir android run test:transport-network-lifecycle

      - name: Fast redline regression
        run: pnpm --dir android run test:redline:fast

      - name: Remote screenshot regression
        run: |
          pnpm --dir android exec vitest run \
            src/lib/remote-screenshot-runtime.test.ts \
            src/lib/remote-screenshot-preview-runtime.test.ts \
            src/pages/TerminalPage.remote-screenshot.test.tsx \
            src/server/remote-screenshot-daemon-blackbox.test.ts \
            src/server/remote-screenshot.test.ts \
            --reporter dot

  daemon-package:
    name: Daemon package dry-run
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare daemon standalone release
        run: pnpm --dir android run daemon:prepare-release

      - name: Prepare daemon npm package
        run: pnpm --dir android run daemon:prepare-npm

      - name: npm pack dry-run
        run: npm pack --dry-run android/release-dist/npm/@jsonstudio__zterm-daemon

  mac-desktop-split:
    name: Mac desktop split gate
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Mac desktop split tests
        run: pnpm --dir mac exec vitest run src/app/MacPaneWorkbench.split.test.tsx --reporter dot

  win-desktop-split:
    name: Windows desktop split gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Windows desktop tests
        run: pnpm --dir win test --reporter dot
