name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation-contracts:
    name: Foundation contract and architecture gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Kernel lifecycle positive and negative suite
        run: pnpm run test:kernel-lifecycle

      - name: Data stream boundary positive and negative suite
        run: pnpm run test:stream-boundary

      - name: iOS host gateway contract suite
        run: pnpm --dir packages/ios-host run type-check && pnpm --dir packages/ios-host run test

      - name: React UI adapter ownership and projection suite
        run: pnpm --dir packages/ui-react run type-check && pnpm --dir packages/ui-react run test

      - name: Desktop gateway codec and stale generation suite
        run: pnpm --dir packages/desktop-gateway run test

      - name: Shared session route and persistence replay suite
        run: pnpm exec vitest run --root packages/shared src/domain/session-route-projection.test.ts src/domain/session-domain.test.ts && node_modules/.bin/vitest run --root packages/shared -c vitest.config.ts src/domain/persistence-settings-projection.test.ts

      - name: Terminal transport, buffer render, and file media suite
        run: pnpm --dir packages/stream-boundary run type-check && pnpm --dir packages/stream-boundary run test

      - name: Phase 7 four-platform parity gate
        run: pnpm run test:phase7-four-platform-parity

      - name: Phase 7 four-platform parity negative suite
        run: pnpm run test:phase7-four-platform-parity:negative

  repo-layout:
    name: App repo layout gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Repo layout gate
        run: pnpm run test:repo-layout

      - name: Git main protection verification profile
        run: |
          ./scripts/setup/enable-local-protection.sh
          pnpm run verify:ci

  android:
    name: Android typecheck and regression
    needs: repo-layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Repo layout gate
        run: pnpm run test:repo-layout

      - name: Check published wterm runtime versions
        run: pnpm --dir android run deps:check-wterm-published

      - name: Type check
        run: pnpm --dir android run type-check

      - name: Android grouped gate inventory and regression
        run: pnpm --dir android run test:ci-gates

  daemon-package:
    name: Daemon package dry-run
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch DAGpipe SDK
        run: |
          git clone https://github.com/Jasonzhangf/DAGpipe.git "$RUNNER_TEMP/dagpipe-sdk"
          git -C "$RUNNER_TEMP/dagpipe-sdk" checkout d88070c9a2ebaaf06d19ebc00ae313bd5f44fd8b
          echo "DAGPIPE_SDK_PATH=$RUNNER_TEMP/dagpipe-sdk" >> "$GITHUB_ENV"

      - name: Prepare daemon standalone release
        run: pnpm --dir android run daemon:prepare-release

      - name: Prepare daemon npm package
        run: pnpm --dir android run daemon:prepare-npm

      - name: npm pack dry-run
        run: npm pack --dry-run android/release-dist/npm/@jsonstudio__zterm-daemon

      - name: Verify packaged daemon runtime
        run: |
          RELEASE_DIR="$(ls -d android/release-dist/zterm-daemon-* | tail -n1)"
          node - "$RELEASE_DIR" <<'NODE'
const { existsSync, readFileSync } = require('node:fs');
const { resolve } = require('node:path');

const releaseDir = resolve(process.argv[2]);
const serverPath = resolve(releaseDir, 'runtime/server.cjs');
const nativePath = resolve(releaseDir, 'runtime/dagpipe.node');
for (const [label, path] of [['server.cjs', serverPath], ['dagpipe.node', nativePath]]) {
  if (!existsSync(path)) {
    console.error(`missing packaged daemon runtime ${label}: ${path}`);
    process.exit(1);
  }
}
const server = readFileSync(serverPath, 'utf8');
if (!server.includes('DAGpipe phase0 operators compiled: native runtime active')) {
  console.error('staged server.cjs does not require DAGpipe native runtime');
  process.exit(1);
}
const compiled = JSON.parse(require(nativePath).compilePhase0());
if (!compiled.ok) {
  console.error(`packaged dagpipe.node compilePhase0 failed: ${compiled.error}`);
  process.exit(1);
}
console.log(`packaged daemon runtime verified: ${releaseDir}`);
NODE

  mac-desktop-split:
    name: Mac desktop split gate
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Mac desktop split tests
        run: pnpm --dir mac exec vitest run src/app/MacPaneWorkbench.split.test.tsx --reporter dot
      - name: Desktop packaged parity gate
        run: pnpm --dir packages/runtime-contracts run build && pnpm --dir packages/desktop-gateway run build && pnpm --dir mac run type-check && pnpm --dir win run type-check && pnpm --dir packages/desktop-gateway run type-check && pnpm --dir packages/desktop-gateway run test && pnpm --dir packages/ui-react run type-check && pnpm --dir packages/ui-react run test

  win-desktop-split:
    name: Windows desktop split gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Windows desktop tests
        run: pnpm --dir win test --reporter dot
